[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sideris-desktop"
version = "5.0.0"
description = "Sideris Desktop - a private AI assistant that runs entirely on your own computer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sideris" }]
keywords = ["local-ai", "llm", "privacy", "desktop", "gguf", "llama.cpp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
inference = ["llama-cpp-python>=0.3.16"]
training = [
  "torch>=2.2",
  "transformers>=4.40,<5",
  "peft>=0.10",
  "datasets>=2.18",
  "accelerate>=0.29",
  "safetensors>=0.4",
  "sentencepiece>=0.1.99",
]
icons = ["pillow>=10"]

[project.scripts]
sideris = "sideris_desktop.__main__:main"

[project.urls]
Homepage = "https://github.com/Dinomax2005/siderisAI"
Releases = "https://github.com/Dinomax2005/siderisAI/releases/latest"
Issues = "https://github.com/Dinomax2005/siderisAI/issues"

[tool.setuptools]
packages = ["sideris_desktop"]
include-package-data = false

[tool.setuptools.package-data]
sideris_desktop = ["*.py"]
